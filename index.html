<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Змейка — Phaser 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #16352a;
        --muted: #3d6a56;
        --sky-top: #c8f0de;
        --sky-bottom: #78c5c2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        color: var(--ink);
        font-family: "Nunito", sans-serif;
        background:
          radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.45), transparent 35%),
          radial-gradient(circle at 80% 0%, rgba(255, 236, 179, 0.35), transparent 30%),
          linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      #game {
        width: min(96vw, 640px);
        height: min(92vh, 720px);
        filter: drop-shadow(0 18px 40px rgba(22, 53, 42, 0.22));
      }

      canvas {
        display: block;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
